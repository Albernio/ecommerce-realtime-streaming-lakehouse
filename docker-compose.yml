version: '3.8'
networks:
  data-pipeline-net:
    driver: bridge
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
    - data-pipeline-net
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
    - zookeeper
    ports:
    - 9092:9092
    - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
    - data-pipeline-net
  spark-master:
    image: apache/spark:3.5.1-python3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
    - 8080:8080
    - 7077:7077
    volumes:
    - ./src:/opt/apache/spark/src
    - ./data:/opt/apache/spark/data
    networks:
    - data-pipeline-net
  spark-worker-1:
    image: apache/spark:3.5.1-python3
    container_name: spark-worker-1
    depends_on:
    - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
    - 8081:8081
    volumes:
    - ./src:/opt/apache/spark/src
    - ./data:/opt/apache/spark/data
    networks:
    - data-pipeline-net
  spark-worker-2:
    image: apache/spark:3.5.1-python3
    container_name: spark-worker-2
    depends_on:
    - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
    - 8082:8081
    volumes:
    - ./src:/opt/apache/spark/src
    - ./data:/opt/apache/spark/data
    networks:
    - data-pipeline-net
  spark-worker-3:
    image: apache/spark:3.5.1-python3
    container_name: spark-worker-3
    depends_on:
    - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
    - 8083:8081
    volumes:
    - ./src:/opt/apache/spark/src
    - ./data:/opt/apache/spark/data
    networks:
    - data-pipeline-net
  localstack:
    image: localstack/localstack:3.4.0
    container_name: localstack
    ports:
    - 4566:4566
    environment:
    - AWS_DEFAULT_REGION=us-east-1
    - SERVICES=s3
    volumes:
    - ./localstack_data:/var/lib/localstack
    networks:
    - data-pipeline-net
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
    - POSTGRES_USER=airflow
    - POSTGRES_PASSWORD=airflow
    - POSTGRES_DB=airflow
    networks:
    - data-pipeline-net
  airflow-init:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-init
    depends_on:
    - airflow-postgres
    environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=46ExudM4L-1ChR3C_q6pI71ne8eBne6T498zU-C23e4=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username admin --firstname
      Admin --lastname User --role Admin --email admin@example.com --password admin"
    networks:
    - data-pipeline-net
  airflow-webserver:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-webserver
    depends_on:
      airflow-postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      spark-master:
        condition: service_started
    environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=46ExudM4L-1ChR3C_q6pI71ne8eBne6T498zU-C23e4=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
    - 8085:8080
    volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    command: webserver
    networks:
    - data-pipeline-net
  airflow-scheduler:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-scheduler
    depends_on:
      airflow-postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started
    environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=46ExudM4L-1ChR3C_q6pI71ne8eBne6T498zU-C23e4=
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    command: scheduler
    networks:
    - data-pipeline-net
